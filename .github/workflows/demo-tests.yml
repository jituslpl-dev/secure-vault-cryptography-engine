name: Reference demo tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile reference demo
        run: python -m py_compile test/demo_python.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_demo_python.py" -v
